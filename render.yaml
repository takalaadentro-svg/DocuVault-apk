services:
  # ---------------------------------------------------------------------------
  # Spring Boot Backend Web Service on Render
  # ---------------------------------------------------------------------------
  - type: web
    name: docuvault-spring-backend
    env: docker
    dockerfilePath: ./backend-spring-boot/Dockerfile
    dockerContext: ./backend-spring-boot
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false # Set to MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_TYPE
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: OCR_SERVICE_URL
        value: http://docuvault-ocr-service:5001/extract-ocr

  # ---------------------------------------------------------------------------
  # EasyOCR Python Microservice on Render
  # ---------------------------------------------------------------------------
  - type: web
    name: docuvault-ocr-service
    env: docker
    dockerfilePath: ./backend-spring-boot/ocr-service-python/Dockerfile
    dockerContext: ./backend-spring-boot/ocr-service-python
    plan: free
    region: oregon
    healthCheckPath: /health

  # ---------------------------------------------------------------------------
  # DocuVault React / Vite Frontend (Static Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: docuvault-frontend
    env: static
    rootDir: mobile
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://<your-backend>.onrender.com/api/v1 (or leave blank if proxied)
