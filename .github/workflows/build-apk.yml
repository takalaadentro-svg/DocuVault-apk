name: Build DocuVault Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-apk:
    name: Compile DocuVault Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android Licenses & Ensure SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: mobile
        run: npm install || true

      - name: Build Web Assets & Sync Capacitor Android
        working-directory: mobile
        run: npm run build:mobile || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ../../gradle-build.log

      - name: Print Entire Gradle Log
        if: always()
        run: |
          cat gradle-build.log

      - name: Upload Debug Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-log
          path: gradle-build.log

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          echo "Locating built APK..."
          find . -name "*.apk"
          FIRST_APK=$(find . -name "*.apk" | head -n 1)
          echo "Selected APK: $FIRST_APK"
          cp "$FIRST_APK" build-output/DocuVault-v1.0.0.apk
          ls -lh build-output/

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuVault-Android-APK
          path: build-output/DocuVault-v1.0.0.apk
          retention-days: 30
